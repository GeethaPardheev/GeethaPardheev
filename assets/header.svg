<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="0.55" stop-color="#132a3a"/>
      <stop offset="1" stop-color="#1d4454"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .line { opacity: 0; animation: cycle 12s infinite; }
      .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
      @keyframes cycle { 0% {opacity:0} 3% {opacity:1} 22% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:1} }
      .wave rect { animation: bar 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bar { 0%,100% {transform: scaleY(.35)} 50% {transform: scaleY(1)} }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- voice waveform motif -->
  <g class="wave" fill="url(#accent)" opacity="0.85">
    <rect x="960" y="95"  width="10" height="110" rx="5" style="animation-delay:0s"/>
    <rect x="982" y="75"  width="10" height="150" rx="5" style="animation-delay:.15s"/>
    <rect x="1004" y="105" width="10" height="90" rx="5" style="animation-delay:.3s"/>
    <rect x="1026" y="60" width="10" height="180" rx="5" style="animation-delay:.45s"/>
    <rect x="1048" y="90" width="10" height="120" rx="5" style="animation-delay:.6s"/>
    <rect x="1070" y="110" width="10" height="80" rx="5" style="animation-delay:.75s"/>
    <rect x="1092" y="80" width="10" height="140" rx="5" style="animation-delay:.9s"/>
    <rect x="1114" y="115" width="10" height="70" rx="5" style="animation-delay:1.05s"/>
  </g>

  <text x="70" y="80" class="mono" font-size="17" fill="#38bdf8">
    <tspan class="pulse">●</tspan> $ whoami
  </text>
  <text x="70" y="140" class="sans" font-size="54" font-weight="700" fill="#ffffff">Geetha Pardheev</text>
  <rect x="72" y="158" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="198" class="sans" font-size="22" fill="#cbd5e1">Backend &amp; AI Infrastructure Engineer · IIT Kharagpur</text>

  <g class="mono" font-size="17" fill="#a5b4fc">
    <text x="70" y="245" class="line l1">&gt; Ex-Amazon · Ex-Toyota Connected · Founding Engineer at a 0→1 startup</text>
    <text x="70" y="245" class="line l2">&gt; Real-time voice AI · 36M+ production calls · &lt;2s p95 latency</text>
    <text x="70" y="245" class="line l3">&gt; Distributed systems serving millions of users</text>
    <text x="70" y="245" class="line l4">&gt; Published NLP researcher · ACM WWW '23 · ESWA '22</text>
  </g>
</svg>
