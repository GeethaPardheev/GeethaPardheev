<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="0.55" stop-color="#132a3a"/>
      <stop offset="1" stop-color="#1d4454"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .line { opacity: 0; animation: cycle 12s infinite; }
      .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
      @keyframes cycle { 0% {opacity:0} 3% {opacity:1} 22% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:1} }
      .sig { stroke-dasharray: 18 200; animation: flow 2.8s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 218 } to { stroke-dashoffset: 0 } }
      .unused { animation: bar 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bar { 0%,100% {transform: scaleY(.35)} 50% {transform: scaleY(1)} }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- network motif: AI + distributed systems -->
  <g>
  <line x1="930" y1="70" x2="1030" y2="110" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="930" y1="70" x2="1030" y2="110" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:0.00s"/>
  <line x1="930" y1="70" x2="1030" y2="190" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="930" y1="70" x2="1030" y2="190" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:0.35s"/>
  <line x1="930" y1="150" x2="1030" y2="110" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="930" y1="150" x2="1030" y2="110" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:0.70s"/>
  <line x1="930" y1="150" x2="1030" y2="190" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="930" y1="150" x2="1030" y2="190" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:1.05s"/>
  <line x1="930" y1="230" x2="1030" y2="110" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="930" y1="230" x2="1030" y2="110" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:1.40s"/>
  <line x1="930" y1="230" x2="1030" y2="190" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="930" y1="230" x2="1030" y2="190" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:1.75s"/>
  <line x1="1030" y1="110" x2="1120" y2="150" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="1030" y1="110" x2="1120" y2="150" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:2.10s"/>
  <line x1="1030" y1="190" x2="1120" y2="150" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="1030" y1="190" x2="1120" y2="150" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="sig" style="animation-delay:2.45s"/>
  <circle cx="930" cy="70" r="20" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="930" cy="70" r="12" fill="#0b1320" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="930" cy="70" r="5" fill="#a78bfa" class="pulse"/>
  <circle cx="930" cy="150" r="20" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="930" cy="150" r="12" fill="#0b1320" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="930" cy="150" r="5" fill="#a78bfa" class="pulse"/>
  <circle cx="930" cy="230" r="20" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="930" cy="230" r="12" fill="#0b1320" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="930" cy="230" r="5" fill="#a78bfa" class="pulse"/>
  <circle cx="1030" cy="110" r="20" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1030" cy="110" r="12" fill="#0b1320" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="1030" cy="110" r="5" fill="#a78bfa" class="pulse"/>
  <circle cx="1030" cy="190" r="20" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1030" cy="190" r="12" fill="#0b1320" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="1030" cy="190" r="5" fill="#a78bfa" class="pulse"/>
  <circle cx="1120" cy="150" r="24" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1120" cy="150" r="16" fill="#0b1320" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="1120" cy="150" r="6" fill="#a78bfa" class="pulse"/>
  </g>

  <text x="70" y="80" class="mono" font-size="17" fill="#38bdf8">
    <tspan class="pulse">●</tspan> $ whoami
  </text>
  <text x="70" y="140" class="sans" font-size="54" font-weight="700" fill="#ffffff">Geetha Pardheev</text>
  <rect x="72" y="158" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="198" class="sans" font-size="22" fill="#cbd5e1">Senior Software Engineer · Backend &amp; Applied AI · IIT Kharagpur</text>

  <g class="mono" font-size="17" fill="#a5b4fc">
    <text x="70" y="245" class="line l1">&gt; Ex-Amazon · Ex-Toyota Connected · Founding Engineer at a 0→1 startup</text>
    <text x="70" y="245" class="line l2">&gt; LLMs · AI agents · RAG · LLM evals · production AI at scale</text>
    <text x="70" y="245" class="line l3">&gt; Distributed systems · real-time voice AI · 36M+ calls served</text>
    <text x="70" y="245" class="line l4">&gt; Published NLP researcher · ACM WWW '23 · ESWA '22</text>
  </g>
</svg>
